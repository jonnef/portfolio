<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0}
  .og{width:1200px;height:630px;box-sizing:border-box;position:relative;overflow:hidden;
      background:#09090b;font-family:Inter,sans-serif;color:#fafafa;padding:84px 96px}
  .dots{position:absolute;inset:0;background-image:radial-gradient(#27272a 1.4px,transparent 1.4px);background-size:24px 24px}
  .glow{position:absolute;right:-180px;top:-200px;width:620px;height:620px;border-radius:50%;
        background:radial-gradient(closest-side,rgba(16,185,129,.22),rgba(16,185,129,0))}
  .content{position:relative}
  .hi{font-family:"DejaVu Sans Mono",monospace;font-size:28px;color:#34d399;margin:0}
  h1{font-size:104px;line-height:1;font-weight:700;letter-spacing:-3px;margin:22px 0 0}
  h2{font-size:52px;font-weight:600;color:#a1a1aa;letter-spacing:-1px;margin:18px 0 0}
  .tags{display:flex;gap:14px;margin-top:52px}
  .tag{font-family:"DejaVu Sans Mono",monospace;font-size:24px;padding:10px 22px;border-radius:999px;
       background:#18181b;border:1.5px solid #27272a;color:#d4d4d8}
  .url{position:absolute;left:96px;bottom:64px;font-size:28px;font-weight:600;color:#fafafa;display:flex;align-items:center;gap:14px}
  .url span{width:12px;height:12px;border-radius:50%;background:#10b981;display:inline-block}
  .bar{position:absolute;left:0;bottom:0;height:8px;width:100%;background:#047857}
</style></head><body>
<div class="og">
  <div class="dots"></div><div class="glow"></div>
  <div class="content">
    <p class="hi">Hi, my name is</p>
    <h1>Kenneth Bolland</h1>
    <h2>Backend Developer Logistics | Fulfillment</h2>
    <div class="tags"><div class="tag">Java</div><div class="tag">Spring Boot</div><div class="tag">Azure</div><div class="tag">Kubernetes</div></div>
  </div>
  <div class="url"><span></span>jonnef.dev</div>
  <div class="bar"></div>
</div>
</body></html>
